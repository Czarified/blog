baseURL = 'https://czarified.github.io/blog/'
locale = 'en-us'
title = 'Back of the Envelope'
# The site lives in a sub-folder (/blog/), so every link must be built from
# baseURL. canonifyURLs does that; relativeURLs broke theme images (/blog/blog/...).
relativeURLs = false
canonifyURLs = true
enableEmoji = true
enableInlineShortcodes = true
enableGitInfo = false
enableRobotsTXT = true

# Use the TailBliss theme, but mount everything EXCEPT its demo `content`
# folder, so the theme's sample posts don't show up on this site.
[module]
  [[module.imports]]
    path = 'tailbliss'
    [[module.imports.mounts]]
      source = 'archetypes'
      target = 'archetypes'
    [[module.imports.mounts]]
      source = 'assets'
      target = 'assets'
    [[module.imports.mounts]]
      source = 'data'
      target = 'data'
    [[module.imports.mounts]]
      source = 'i18n'
      target = 'i18n'
    [[module.imports.mounts]]
      source = 'layouts'
      target = 'layouts'
    [[module.imports.mounts]]
      source = 'static'
      target = 'static'

# Math: text between $...$ (inline) or $$...$$ (display) is passed untouched
# to layouts/_markup/render-passthrough.html, which renders it with KaTeX.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\[', '\]']]
    inline = [['$', '$'], ['\(', '\)']]

[params]
  author = 'Benjamin Crews'
  moto = "Unpolished, probably incorrect, but maybe there's a good idea here somewhere..."
  description = 'The personal blog of Benjamin Crews.'
  og_image = '/images/tailbliss-cover.png'
  newsletter_signup = false

  # Big image at the top of the home page. Path is relative to assets/.
  heroimage = 'images/global/hero.jpg'
  heroalt = 'Benjamin Crews'

[params.social_media]
  [params.social_media.github]
    enabled = true
    url = 'https://github.com/Czarified'
  [params.social_media.facebook]
    enabled = false
  [params.social_media.instagram]
    enabled = false
  [params.social_media.twitter]
    enabled = false

# Menu URLs have NO leading slash: '/posts/' would point outside /blog/.
[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = './'
    weight = 10
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = 'posts/'
    weight = 20
  [[menu.footer]]
    identifier = 'home'
    name = 'Home'
    url = './'
    weight = 10
  [[menu.footer]]
    identifier = 'posts'
    name = 'Posts'
    url = 'posts/'
    weight = 20

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Home page sections, top to bottom. Image paths are relative to assets/.
[params.p1]
  heading = 'About This Site'
  image = 'images/global/none.jpg'
  crop = '600x750'      # width x height in pixels; sets the image's shape
  content = [
    { text = """
    Welcome! I write about structural engineering, software development, and personal projects.
    """},
    { text = """
    I'm a huge aerospace nerd and always have been. From a young age I wanted to be a fighter pilot. I slowly realized that I was probably more cut out to build the planes than fly them, and I haven't looked back! Rockets and space are cool, but my heart has always and will always be with anything that flies Hard, Heavy, High, Hot, and Fast. At least one, but preferably all!
    """},
    { text = """
    Outside of aerospace, I follow a lot of tech. I try to keep up with any news related to compute, simulation, PC gaming, and even AI. If I get up to anything there, I might post here about it too.
    """}
  ]

[params.p2]
  heading = "What I'm Working On"
  image = 'images/global/projects.png'
  crop = '800x400'     # width x height in pixels; taller than wide = portrait
  content = [
    { text = 'Check out my latest blog posts below to see recent projects and tutorials.' }
  ]

[params.p3]
  heading = 'I Have No Idea What to Put Here!'
  content = [
    { text = 'Eventually I will figure out something to fill in this space.'},
  ]
  links = [
    { text = 'This goes nowhere', url = '#'}
  ]
  # The theme shows a grid of logos beside this section; empty hides it.
  logos = []

[params.p4]
  heading = 'From the Blog'
  content = []
